[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetlab"
version = "0.1.0"
description = "A simulation-and-optimization framework for the Dial-a-Ride Problem, for loadables that may be people or goods."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vehicle Routing Solution study team" }]
keywords = ["dial-a-ride", "darp", "vehicle-routing", "operations-research", "simulation-optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# The MIP lane exports standard LP files with no solver dependency at all.
# Install this extra only if you want to solve in-process.
solvers = ["pulp>=2.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.8",
]

[project.urls]
Repository = "https://github.com/REPLACE-ME/fleetlab"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetlab"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "C4",          # comprehensions
  "SIM",         # simplify
  "RET",         # return
  "ARG",         # unused arguments
  "PTH",         # use pathlib
  "RUF",         # ruff-specific
  "TRY",         # tryceratops -- exception antipatterns
  "EM",          # error messages
  "D",           # pydocstyle
]
ignore = [
  "D105",   # magic method docstrings
  "D107",   # __init__ docstring (documented on the class)
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "TRY003", # long messages in raise -- fine for programmer-error asserts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ARG001", "ARG002"]
"examples/*" = ["D100", "D103", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = "pulp.*"
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: long-running tests, deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
source = ["src/fleetlab"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
